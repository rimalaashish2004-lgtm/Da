<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dash: Cyber Runner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #030014;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.5), 0 0 30px rgba(0, 243, 255, 0.3);
        }
        .glow-box {
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(255, 0, 128, 0.2);
        }
        .cyber-button {
            background: linear-gradient(135deg, #00f3ff 0%, #ff0080 100%);
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }
        .cyber-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 128, 0.8);
        }
        .cyber-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-950 text-white">

    <!-- Three.js Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-6">
        
        <!-- Top HUD -->
        <div id="hud" class="flex justify-between items-center w-full max-w-4xl mx-auto opacity-0 transition-opacity duration-300">
            <div class="flex items-center gap-6 bg-slate-900/80 backdrop-blur-md px-6 py-3 rounded-2xl border border-cyan-500/30 glow-box">
                <div class="flex flex-col">
                    <span class="text-xs uppercase tracking-widest text-cyan-400 font-semibold">Score</span>
                    <span id="score-display" class="text-3xl font-black text-white font-mono">0</span>
                </div>
                <div class="h-8 w-px bg-slate-700"></div>
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-full bg-amber-400/20 flex items-center justify-center border border-amber-400 text-amber-300 font-bold text-sm shadow-[0_0_10px_rgba(251,191,36,0.5)]">¢</div>
                    <span id="coins-display" class="text-2xl font-bold text-amber-300 font-mono">0</span>
                </div>
            </div>

            <!-- Sound Controls -->
            <div class="flex items-center gap-3 pointer-events-auto">
                <button id="sound-btn" onclick="toggleAudio()" class="w-12 h-12 rounded-xl bg-slate-900/80 border border-cyan-500/30 flex items-center justify-center text-cyan-400 hover:bg-cyan-500/20 transition cursor-pointer">
                    🔊
                </button>
            </div>
        </div>

        <!-- Center Notification -->
        <div class="flex justify-center items-center flex-1 pointer-events-none">
            <div id="popup-text" class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 glow-text opacity-0 transition-all duration-300 transform scale-50">
                COMBO x2!
            </div>
        </div>

        <!-- Mobile Touch Controls Bar -->
        <div id="mobile-controls" class="flex justify-between items-center w-full max-w-md mx-auto pb-4 opacity-0 transition-opacity duration-300 pointer-events-auto md:hidden">
            <div class="flex gap-4">
                <button ontouchstart="handleMobileInput('left')" class="w-20 h-20 bg-slate-900/80 border-2 border-cyan-500/50 rounded-2xl flex items-center justify-center text-3xl text-cyan-400 active:bg-cyan-500/30">◀</button>
                <button ontouchstart="handleMobileInput('right')" class="w-20 h-20 bg-slate-900/80 border-2 border-cyan-500/50 rounded-2xl flex items-center justify-center text-3xl text-cyan-400 active:bg-cyan-500/30">▶</button>
            </div>
            <div class="flex gap-4">
                <button ontouchstart="handleMobileInput('slide')" class="w-20 h-20 bg-slate-900/80 border-2 border-pink-500/50 rounded-2xl flex items-center justify-center text-3xl text-pink-400 active:bg-pink-500/30">🔽</button>
                <button ontouchstart="handleMobileInput('jump')" class="w-20 h-20 bg-slate-900/80 border-2 border-cyan-500/50 rounded-2xl flex items-center justify-center text-3xl text-cyan-400 active:bg-cyan-500/30">▲</button>
            </div>
        </div>
    </div>

    <!-- Menu Overlay (Start / Game Over) -->
    <div id="menu-overlay" class="absolute inset-0 z-20 flex items-center justify-center bg-slate-950/80 backdrop-blur-lg transition-opacity duration-500 p-4">
        <div class="bg-slate-900/90 border-2 border-cyan-500/40 p-8 md:p-12 rounded-3xl max-w-lg w-full text-center glow-box shadow-[0_0_50px_rgba(0,243,255,0.2)]">
            <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 glow-text mb-3 tracking-wider">
                NEON DASH
            </h1>
            <p id="menu-subtitle" class="text-cyan-300/80 text-sm md:text-base mb-8 font-medium">
                CYBER RUNNER 3D
            </p>

            <!-- Stats Box -->
            <div id="game-over-stats" class="hidden mb-8 grid grid-cols-2 gap-4 bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
                <div class="flex flex-col">
                    <span class="text-xs text-slate-400 uppercase tracking-wider">Final Score</span>
                    <span id="final-score" class="text-2xl font-black text-white font-mono">0</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs text-slate-400 uppercase tracking-wider">Cyber Cores</span>
                    <span id="final-coins" class="text-2xl font-black text-amber-300 font-mono">0</span>
                </div>
            </div>

            <!-- Controls Instruction -->
            <div class="mb-8 text-xs md:text-sm text-slate-300 bg-slate-950/40 p-4 rounded-2xl border border-slate-800/80 space-y-2">
                <div class="font-semibold text-cyan-400 mb-1">CONTROLS</div>
                <div class="grid grid-cols-2 gap-2 text-left">
                    <div><span class="text-cyan-300 font-bold">A / D</span> or <span class="text-cyan-300 font-bold">← / →</span>: Switch Lane</div>
                    <div><span class="text-cyan-300 font-bold">W</span> or <span class="text-cyan-300 font-bold">↑ / Space</span>: Jump</div>
                    <div><span class="text-cyan-300 font-bold">S</span> or <span class="text-cyan-300 font-bold">↓</span>: Slide / Roll</div>
                </div>
            </div>

            <button onclick="startGame()" class="cyber-button w-full py-4 rounded-2xl font-extrabold text-xl text-slate-950 tracking-wider cursor-pointer uppercase">
                Initialize Run
            </button>
        </div>
    </div>

    <!-- Game Logic Script -->
    <script>
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'slide') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.setValueAtTime(1200, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'move') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(450, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                }
            } catch (e) {}
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        const LANES = [-2.5, 0, 2.5];
        let currentLane = 1;
        let score = 0;
        let coins = 0;
        let gameRunning = false;
        let gameSpeed = 0.45;
        let baseSpeed = 0.45;

        let playerY = 0;
        let playerVY = 0;
        let gravity = 0.022;
        let jumpForce = 0.4;
        let isJumping = false;
        let isSliding = false;
        let slideTimer = 0;

        let obstacles = [];
        let collectibleCoins = [];
        let sceneryBuildings = [];
        let roadGridLines = [];

        let scene, camera, renderer, playerGroup, playerMesh;

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030014);
            scene.fog = new THREE.FogExp2(0x030014, 0.025);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 7);
            camera.lookAt(0, 1.5, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0x00f3ff, 1.2);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            createEnvironment();
            createPlayer();

            window.addEventListener('resize', onWindowResize);
        }

        function createEnvironment() {
            const roadGeo = new THREE.PlaneGeometry(12, 300);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x09051f, roughness: 0.4, metalness: 0.8 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -100;
            scene.add(road);

            for (let i = -150; i < 50; i += 6) {
                const lineGeo = new THREE.BoxGeometry(0.1, 0.05, 3);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
                
                const lLine = new THREE.Mesh(lineGeo, lineMat);
                lLine.position.set(-1.25, 0.02, i);
                scene.add(lLine);
                roadGridLines.push(lLine);

                const rLine = new THREE.Mesh(lineGeo, lineMat);
                rLine.position.set(1.25, 0.02, i);
                scene.add(rLine);
                roadGridLines.push(rLine);
            }

            for (let i = -120; i < 40; i += 15) {
                createBuilding(-9, i);
                createBuilding(9, i);
            }
        }

        function createBuilding(x, z) {
            const width = 5 + Math.random() * 4;
            const height = 20 + Math.random() * 30;
            const depth = 6 + Math.random() * 4;

            const bGeo = new THREE.BoxGeometry(width, height, depth);
            const bMat = new THREE.MeshStandardMaterial({ color: 0x070314, roughness: 0.2, metalness: 0.9, emissive: 0x001122, emissiveIntensity: 0.2 });
            const building = new THREE.Mesh(bGeo, bMat);
            building.position.set(x + (x > 0 ? width/2 : -width/2), height / 2, z);
            scene.add(building);
            sceneryBuildings.push(building);
        }

        function createPlayer() {
            playerGroup = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, roughness: 0.3, metalness: 0.8, emissive: 0x004455 });
            
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), bodyMat);
            torso.position.y = 1.0;
            playerGroup.add(torso);

            const headMat = new THREE.MeshStandardMaterial({ color: 0xff0080, roughness: 0.2, emissive: 0x550033 });
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), headMat);
            head.position.y = 1.6;
            playerGroup.add(head);

            const boardMat = new THREE.MeshStandardMaterial({ color: 0xff0080, roughness: 0.1, metalness: 0.9, emissive: 0xff0080, emissiveIntensity: 0.6 });
            playerMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.15, 1.8), boardMat);
            playerMesh.position.y = 0.3;
            playerGroup.add(playerMesh);

            playerGroup.position.set(LANES[currentLane], 0, 0);
            scene.add(playerGroup);
        }

        let spawnTimer = 0;
        function updateWorld() {
            if (!gameRunning) return;

            gameSpeed = baseSpeed + Math.floor(score / 500) * 0.05;

            roadGridLines.forEach(line => {
                line.position.z += gameSpeed;
                if (line.position.z > 20) line.position.z = -150;
            });

            sceneryBuildings.forEach(b => {
                b.position.z += gameSpeed;
                if (b.position.z > 25) b.position.z = -120;
            });

            spawnTimer += gameSpeed;
            if (spawnTimer > 35) {
                spawnTimer = 0;
                spawnObstacleWave();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.mesh.position.z += gameSpeed;

                if (checkCollision(obs)) {
                    triggerGameOver();
                    return;
                }

                if (obs.mesh.position.z > 10) {
                    scene.remove(obs.mesh);
                    obstacles.splice(i, 1);
                }
            }

            for (let i = collectibleCoins.length - 1; i >= 0; i--) {
                let coin = collectibleCoins[i];
                coin.mesh.position.z += gameSpeed;
                coin.mesh.rotation.y += 0.05;

                if (checkCoinCollection(coin)) {
                    coins++;
                    score += 50;
                    document.getElementById('coins-display').innerText = coins;
                    playSound('coin');
                    scene.remove(coin.mesh);
                    collectibleCoins.splice(i, 1);
                    continue;
                }

                if (coin.mesh.position.z > 10) {
                    scene.remove(coin.mesh);
                    collectibleCoins.splice(i, 1);
                }
            }

            score += Math.round(gameSpeed * 2);
            document.getElementById('score-display').innerText = score;
        }

        function spawnObstacleWave() {
            const laneChoices = [0, 1, 2];
            const blockedLanesCount = Math.random() > 0.4 ? 2 : 1;
            laneChoices.sort(() => Math.random() - 0.5);
            const blockedLanes = laneChoices.slice(0, blockedLanesCount);

            blockedLanes.forEach(lane => {
                const type = Math.random();
                let obsMesh;

                if (type > 0.5) {
                    const geo = new THREE.BoxGeometry(2.0, 1.2, 0.4);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.5 });
                    obsMesh = new THREE.Mesh(geo, mat);
                    obsMesh.position.set(LANES[lane], 0.6, -120);
                    obstacles.push({ mesh: obsMesh, lane: lane, type: 'barrier' });
                } else {
                    const geo = new THREE.BoxGeometry(2.2, 0.3, 0.3);
                    const mat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
                    obsMesh = new THREE.Mesh(geo, mat);
                    obsMesh.position.set(LANES[lane], 2.0, -120);
                    obstacles.push({ mesh: obsMesh, lane: lane, type: 'laser' });
                }
                scene.add(obsMesh);
            });

            const openLanes = laneChoices.slice(blockedLanesCount);
            openLanes.forEach(lane => {
                if (Math.random() > 0.3) {
                    for (let c = 0; c < 4; c++) {
                        const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
                        const coinMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
                        const coin = new THREE.Mesh(coinGeo, coinMat);
                        coin.rotation.z = Math.PI / 2;
                        coin.position.set(LANES[lane], 0.8, -120 - (c * 2));
                        scene.add(coin);
                        collectibleCoins.push({ mesh: coin, lane: lane });
                    }
                }
            });
        }

        function checkCollision(obs) {
            if (obs.lane !== currentLane) return false;
            const dz = Math.abs(obs.mesh.position.z - playerGroup.position.z);
            if (dz > 0.8) return false;

            if (obs.type === 'barrier' && playerY < 0.9) return true;
            if (obs.type === 'laser' && !isSliding && playerY < 1.5) return true;
            return false;
        }

        function checkCoinCollection(coin) {
            if (coin.lane !== currentLane) return false;
            const dz = Math.abs(coin.mesh.position.z - playerGroup.position.z);
            return dz < 1.0 && playerY < 1.5;
        }

        function updatePlayerPhysics() {
            if (!gameRunning) return;

            const targetX = LANES[currentLane];
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.2;

            if (isJumping || playerY > 0) {
                playerVY -= gravity;
                playerY += playerVY;
                if (playerY <= 0) {
                    playerY = 0;
                    isJumping = false;
                    playerVY = 0;
                }
            }

            if (isSliding) {
                slideTimer -= 1;
                if (slideTimer <= 0) {
                    isSliding = false;
                    playerGroup.scale.set(1, 1, 1);
                }
            }

            playerGroup.position.y = playerY;
            playerMesh.rotation.z = Math.sin(Date.now() * 0.01) * 0.05;
        }

        function moveLane(dir) {
            if (!gameRunning) return;
            currentLane += dir;
            if (currentLane < 0) currentLane = 0;
            if (currentLane > 2) currentLane = 2;
            playSound('move');
        }

        function jump() {
            if (!gameRunning) return;
            if (!isJumping && playerY === 0) {
                isJumping = true;
                playerVY = jumpForce;
                playSound('jump');
            }
        }

        function slide() {
            if (!gameRunning) return;
            if (!isSliding && playerY === 0) {
                isSliding = true;
                slideTimer = 30;
                playerGroup.scale.set(1, 0.5, 1);
                playSound('slide');
            }
        }

        window.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') jump();
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') slide();
        });

        function handleMobileInput(action) {
            if (action === 'left') moveLane(-1);
            if (action === 'right') moveLane(1);
            if (action === 'jump') jump();
            if (action === 'slide') slide();
        }

        function startGame() {
            initAudio();
            document.getElementById('menu-overlay').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                document.getElementById('menu-overlay').style.display = 'none';
            }, 500);

            document.getElementById('hud').classList.remove('opacity-0');
            document.getElementById('mobile-controls').classList.remove('opacity-0');

            score = 0;
            coins = 0;
            gameSpeed = 0.45;
            baseSpeed = 0.45;
            currentLane = 1;
            playerY = 0;
            isJumping = false;
            isSliding = false;

            obstacles.forEach(o => scene.remove(o.mesh));
            collectibleCoins.forEach(c => scene.remove(c.mesh));
            obstacles = [];
            collectibleCoins = [];

            gameRunning = true;
        }

        function triggerGameOver() {
            gameRunning = false;
            playSound('hit');

            document.getElementById('final-score').innerText = score;
            document.getElementById('final-coins').innerText = coins;
            document.getElementById('game-over-stats').classList.remove('hidden');
            document.getElementById('menu-subtitle').innerText = 'CRITICAL SYSTEM FAILURE - RUN TERMINATED';

            const menu = document.getElementById('menu-overlay');
            menu.style.display = 'flex';
            setTimeout(() => {
                menu.classList.remove('opacity-0', 'pointer-events-none');
            }, 50);

            document.getElementById('hud').classList.add('opacity-0');
            document.getElementById('mobile-controls').classList.add('opacity-0');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePlayerPhysics();
            updateWorld();
            renderer.render(scene, camera);
        }

        initThree();
        animate();
    </script>
</body>
</html>
